<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TranscriptBot</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav>
        <div class="nav-inner">
            <div class="logo">TB<span class="logo-dot">.</span></div>
            <div class="nav-stats" id="stats"></div>
            <button class="nav-btn" onclick="toggleSection('settings-panel')" id="settings-toggle" title="Settings">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
        </div>
    </nav>

    <!-- Settings dropdown -->
    <div class="settings-panel collapsed" id="settings-panel">
        <div class="settings-inner">
            <label>YouTube Data API Key</label>
            <div class="input-row">
                <input type="password" id="api-key" placeholder="Paste your API key here">
                <button onclick="saveApiKey()" class="btn btn-sm">Save</button>
            </div>
            <p class="hint" id="key-status"></p>
        </div>
    </div>

    <main>
        <!-- Hero / Archive -->
        <section class="hero">
            <h1>Archive YouTube Transcripts</h1>
            <p class="hero-sub">Paste a channel URL to download every transcript, then search and analyze.</p>
            <div class="archive-box">
                <input type="text" id="channel-url"
                       placeholder="https://www.youtube.com/@ChannelName"
                       onkeydown="if(event.key==='Enter') startArchive()">
                <button onclick="startArchive()" class="btn btn-primary" id="archive-btn">Archive</button>
            </div>
            <div id="progress-area" class="hidden">
                <div class="progress-track">
                    <div class="progress-fill" id="progress-bar"></div>
                </div>
                <p class="progress-label" id="progress-text"></p>
            </div>
        </section>

        <!-- Search -->
        <section class="search-section">
            <div class="search-box">
                <svg class="search-icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                <input type="text" id="search-query"
                       placeholder="Search across all transcripts..."
                       onkeydown="if(event.key==='Enter') doSearch()">
            </div>
            <div id="search-results"></div>
        </section>

        <!-- Channels -->
        <section class="channels-section" id="channels-section">
            <h2>Archived Channels</h2>
            <div id="channels-list">
                <p class="empty">No channels archived yet.</p>
            </div>
        </section>
    </main>

    <script src="/static/app.js"></script>
</body>
</html>
